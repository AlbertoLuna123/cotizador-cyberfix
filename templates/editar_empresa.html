{% extends "base.html" %}
{% block title %}Nombre de la Página{% endblock %}
{% block content %}

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white fw-bold">
                        Editar Información de Empresa
                    </div>
                    <div class="card-body">
                        <!-- El formulario envía por POST a la misma ruta -->
                        <form action="/empresas/editar/{{ empresa.id_empresa }}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label small">Nombre Comercial*</label>
                                <input type="text" class="form-control form-control-sm" name="nombre_comercial" value="{{ empresa.nombre_comercial_empresa or '' }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small">Razón Social</label>
                                <input type="text" class="form-control form-control-sm" name="razon_social" value="{{ empresa.razon_social_empresa or '' }}">
                            </div>
                            
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label small">RFC</label>
                                    <input type="text" class="form-control form-control-sm" name="rfc" value="{{ empresa.rfc_empresa or '' }}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label small">C.P.</label>
                                    <input type="text" class="form-control form-control-sm" name="cp" value="{{ empresa.cp_empresa or '' }}">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small">Teléfono 1</label>
                                    <input type="text" class="form-control form-control-sm" name="telefono1" value="{{ empresa.telefono1_empresa or '' }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small">Teléfono 2</label>
                                    <input type="text" class="form-control form-control-sm" name="telefono2" value="{{ empresa.telefono2_empresa or '' }}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small">Correo Electrónico</label>
                                <input type="email" class="form-control form-control-sm" name="correo" value="{{ empresa.email_empresa or '' }}">
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="/empresas" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-info text-white">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
