<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Empresas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">&larr; Volver al Panel</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario de nueva empresa -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white fw-bold">Registrar Nueva Empresa</div>
                    <div class="card-body">
                        <form action="/empresas" method="POST">
                            <div class="mb-3">
                                <label>Nombre Comercial*</label>
                                <input type="text" class="form-control" name="nombre_comercial" required>
                            </div>
                            <div class="mb-3">
                                <label>Razón Social</label>
                                <input type="text" class="form-control" name="razon_social">
                            </div>
                            <div class="mb-3">
                                <label>RFC</label>
                                <input type="text" class="form-control" name="rfc">
                            </div>
                            <div class="mb-3">
                                <label>Teléfono</label>
                                <input type="text" class="form-control" name="telefono">
                            </div>
                            <div class="mb-3">
                                <label>Correo Electrónico</label>
                                <input type="email" class="form-control" name="correo">
                            </div>
                            <button type="submit" class="btn btn-info text-white w-100">Guardar Empresa</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de empresas -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="text-info fw-bold mb-3">Tus Empresas Registradas</h4>
                        <table class="table table-striped table-hover">
                            <thead class="table-info">
                                <tr>
                                    <th>Nombre</th>
                                    <th>RFC</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for emp in empresas %}
                                <tr>
                                    <td><strong>{{ emp.nombre_comercial_empresa }}</strong><br><small class="text-muted">{{ emp.razon_social_empresa }}</small></td>
                                    <td>{{ emp.rfc_empresa }}</td>
                                    <td>{{ emp.telefono1_empresa }}</td>
                                    <td>{{ emp.email_empresa }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
