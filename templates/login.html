<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CotizadorPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary">CotizadorPro</h3>
                            <p class="text-muted">Inicia sesión o regístrate</p>
                        </div>
                        
                        <div id="error-message" class="alert alert-danger d-none small"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" required placeholder="ejemplo@correo.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">Contraseña</label>
                                <input type="password" id="password" class="form-control" required placeholder="********">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3" id="btnSubmit">
                                Ingresar con Correo
                            </button>
                        </form>

                        <div class="d-flex align-items-center my-3">
                            <hr class="flex-grow-1">
                            <span class="px-3 text-muted small">O continua con</span>
                            <hr class="flex-grow-1">
                        </div>

                        <!-- Botón de Google -->
                        <button type="button" class="btn btn-outline-dark w-100 fw-bold" id="btnGoogle">
                            <i class="bi bi-google text-danger me-2"></i> Google
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        // IMPORTANTE: Agregamos GoogleAuthProvider y signInWithPopup
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUFNhA1qDXsg3mlvUwIHW0KG_9vKrYnC0",
            authDomain: "cotizador-cyberfix.firebaseapp.com",
            projectId: "cotizador-cyberfix",
            storageBucket: "cotizador-cyberfix.firebasestorage.app",
            messagingSenderId: "200058533997",
            appId: "1:200058533997:web:1606f111d675ed0e26a764",
            measurementId: "G-SZMHEM2WZM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Inicializamos el proveedor de Google
        const googleProvider = new GoogleAuthProvider();

        const errorDiv = document.getElementById('error-message');

        // Función para enviar el token a Flask (La reutilizamos para ambos métodos)
        async function enviarTokenAFlask(idToken, btnElement, textoOriginal) {
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: idToken })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    window.location.href = data.redirect;
                } else {
                    mostrarError("Error en el servidor: " + data.message, btnElement, textoOriginal);
                }
            } catch (error) {
                mostrarError("Error de conexión con el servidor.", btnElement, textoOriginal);
            }
        }

        function mostrarError(mensaje, btnElement, textoOriginal) {
            errorDiv.textContent = mensaje;
            errorDiv.classList.remove('d-none');
            btnElement.disabled = false;
            btnElement.innerHTML = textoOriginal;
        }

        // Lógica: Iniciar con Correo
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnSubmit = document.getElementById('btnSubmit');
            
            errorDiv.classList.add('d-none');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Conectando...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const idToken = await userCredential.user.getIdToken();
                await enviarTokenAFlask(idToken, btnSubmit, 'Ingresar con Correo');
            } catch (error) {
                mostrarError("Correo o contraseña incorrectos.", btnSubmit, 'Ingresar con Correo');
            }
        });

        // Lógica: Iniciar con Google
        document.getElementById('btnGoogle').addEventListener('click', async () => {
            const btnGoogle = document.getElementById('btnGoogle');
            errorDiv.classList.add('d-none');
            btnGoogle.disabled = true;
            btnGoogle.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Abriendo Google...';

            try {
                const result = await signInWithPopup(auth, googleProvider);
                const idToken = await result.user.getIdToken();
                await enviarTokenAFlask(idToken, btnGoogle, '<i class="bi bi-google text-danger me-2"></i> Google');
            } catch (error) {
                mostrarError("Se canceló o falló el inicio de sesión con Google.", btnGoogle, '<i class="bi bi-google text-danger me-2"></i> Google');
            }
        });
    </script>
</body>
</html>
