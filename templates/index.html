{% extends "base.html" %}

{% block title %}Inicio - Dashboard{% endblock %}

{% block content %}
    <h2 class="fw-bold mb-4">Panel de Control</h2>
    
    <!-- Aquí puedes mantener las tarjetas informativas que ya tenías o crear un resumen -->
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 border-start border-success border-4 h-100">
                <div class="card-body">
                    <h6 class="text-success fw-bold text-uppercase">Clientes Registrados</h6>
                    <h2 class="display-6 fw-bold">Gestionar</h2>
                    <a href="/clientes" class="btn btn-outline-success btn-sm mt-2">Ver directorio &rarr;</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 border-start border-info border-4 h-100">
                <div class="card-body">
                    <h6 class="text-info fw-bold text-uppercase">Empresas Emisoras</h6>
                    <h2 class="display-6 fw-bold">Gestionar</h2>
                    <a href="/empresas" class="btn btn-outline-info btn-sm mt-2">Ver entidades &rarr;</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 border-start border-primary border-4 h-100 bg-primary text-white">
                <div class="card-body">
                    <h6 class="fw-bold text-uppercase text-white-50">Acción Rápida</h6>
                    <h2 class="display-6 fw-bold">Nueva Cotización</h2>
                    <a href="/cotizador" class="btn btn-light btn-sm mt-2 fw-bold text-primary">Generar ahora &rarr;</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
