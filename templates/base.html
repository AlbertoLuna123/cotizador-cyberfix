<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaS Cotizador{% endblock %}</title>
    
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        .sidebar {
            height: 100vh; /* Altura fija al 100% de la ventana */
            position: sticky; /* Hace que se quede pegado */
            top: 0; /* Lo pega exactamente en el borde superior */
            overflow-y: auto; /* Si agregas muchos menús después, permitirá hacer scroll solo en la barra oscura */
            background-color: #212529;
        }
        .nav-link {
            color: #adb5bd;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff;
            background-color: #0d6efd; /* Azul de selección */
        }
        /* Color de fondo para todo el sistema */
        body { background-color: #f8f9fa; } 
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            
            <!-- INICIO DEL PANEL LATERAL (SIDEBAR) -->
            <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar shadow">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 text-white min-vh-100">
                    
                    <!-- Logotipo / Título -->
                    <a href="/home" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <i class="bi bi-box-seam fs-3 text-primary me-2"></i>
                        <span class="fs-4 d-none d-sm-inline fw-bold">Cotizador<span class="text-primary">Pro</span></span>
                    </a>
                    
                    <hr class="w-100 text-secondary d-none d-sm-block">

                    <!-- Menú de Navegación -->
                    <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100 mt-3" id="menu">
                        <li class="nav-item w-100 mb-1">
                            <a href="/" class="nav-link align-middle px-3 text-truncate">
                                <i class="fs-5 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Inicio</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-1">
                            <a href="/empresas" class="nav-link align-middle px-3 text-truncate">
                                <i class="fs-5 bi-building"></i> <span class="ms-1 d-none d-sm-inline">Mis Empresas</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-1">
                            <a href="/clientes" class="nav-link align-middle px-3 text-truncate">
                                <i class="fs-5 bi-people"></i> <span class="ms-1 d-none d-sm-inline">Mis Clientes</span>
                            </a>
                        </li>
                        
                        <li class="nav-item w-100 mb-1 mt-3">
                            <small class="text-secondary fw-bold text-uppercase d-none d-sm-block px-3 mb-2">Cotizaciones</small>
                            <a href="/cotizaciones" class="nav-link align-middle px-3 text-truncate">
                                <i class="fs-5 bi-folder2-open"></i> <span class="ms-1 d-none d-sm-inline">Gestión de Cotizaciones</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-1">
                            <a href="/historial_cotizaciones" class="nav-link align-middle px-3 text-truncate">
                                <i class="fs-5 bi-people"></i> <span class="ms-1 d-none d-sm-inline">Historial de Cotizaciones</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-1">
                            <a href="/cotizador" class="nav-link align-middle px-3 text-truncate text-white bg-success">
                                <i class="fs-5 bi-file-earmark-plus"></i> <span class="ms-1 d-none d-sm-inline">Crear Nueva Cotización</span>
                            </a>
                        </li>
                    </ul>
                    <hr class="w-100 text-secondary">
                    
                    <!-- Perfil Inferior -->
                    <div class="dropdown pb-4 w-100">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none px-3" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-3 text-secondary"></i>
                            <span class="d-none d-sm-inline mx-2">{{ current_user.nombre_user }} {{ current_user.apellidos_user }}</span>
                        </a>
                    </div>
                    <!-- Botón de Logout -->
                    <div class="px-2 mb-3">
                        <a href="/logout" class="nav-link align-middle px-3 text-danger">
                            <i class="fs-5 bi-box-arrow-left"></i> <span class="ms-1 d-none d-sm-inline">Cerrar sesión</span>
                        </a>
                    </div>
                </div>
            </div>
            <!-- FIN DEL PANEL LATERAL -->

            <!-- HUECO PARA EL CONTENIDO DINÁMICO -->
            <div class="col py-4 px-md-5">
                {% block content %}
                <!-- Jinja2 insertará aquí el contenido de tus otras páginas -->
                {% endblock %}
            </div>

        </div>
    </div>

    <!-- JS de Bootstrap (necesario para menús desplegables o modales en el futuro) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
