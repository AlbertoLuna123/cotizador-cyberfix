<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">&larr; Volver al Panel</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario de nuevo cliente -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white fw-bold">Registrar Nuevo Cliente</div>
                    <div class="card-body">
                        <form action="/clientes" method="POST">
                            <div class="mb-3">
                                <label>Razón Social o Nombre*</label>
                                <input type="text" class="form-control" name="razon_social" required>
                            </div>
                            <div class="mb-3">
                                <label>Contacto (Atención a)</label>
                                <input type="text" class="form-control" name="contacto">
                            </div>
                            <div class="mb-3">
                                <label>RFC</label>
                                <input type="text" class="form-control" name="rfc">
                            </div>
                            <div class="mb-3">
                                <label>Teléfono</label>
                                <input type="text" class="form-control" name="telefono">
                            </div>
                            <div class="mb-3">
                                <label>Correo Electrónico</label>
                                <input type="email" class="form-control" name="correo">
                            </div>
                            <div class="mb-3">
                                <label>Dirección Fiscal</label>
                                <input type="text" class="form-control" name="direccion">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Guardar Cliente</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de clientes -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="text-success fw-bold mb-3">Tu Cartera de Clientes</h4>
                        <table class="table table-striped table-hover">
                            <thead class="table-success">
                                <tr>
                                    <th>Cliente</th>
                                    <th>Contacto</th>
                                    <th>RFC / Teléfono</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for cli in clientes %}
                                <tr>
                                    <td><strong>{{ cli.razon_social_cliente }}</strong><br><small class="text-muted">{{ cli.email_cliente }}</small></td>
                                    <td>{{ cli.nombre_contacto_cliente }}</td>
                                    <td>{{ cli.rfc_cliente }}<br><small>{{ cli.telefono1_cliente }}</small></td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
